[project] 
site_url            = "https://find-software.org"
site_name           = "find.software" 
site_description    = "Your project description"
site_author         = "Ronny Gey, Oliver Karras, Daniel Mietchen, Zahra Rahgooy, Ankit Satpute" 
strict              = false 
use_directory_urls  = true
copyright           = '''Copyright &copy; 2026 
<a href="https://www.ufz.de">Helmholtz Centre for Environmental Research -
UFZ</a> | <a href="https://www.ufz.de/imprint">Imprint</a>'''
repo_url            = "https://github.com/findsoftware/findsoftware.github.io" 
repo_name           = "findsoftware.github.io"
edit_uri            = "blob/main/docs/"

nav = [

  { "Home" = "index.md" },

  { "Team" = [
    "team/index.md",
  ]},

  { "Publications" = [
    "publications/index.md",
  ]},

  { "Workshops" = [
    "workshops/index.md",
  ]},

  { "Services" = [
    "services/index.md",
    {"Personas" = "services/personas.md"},
  ]},

  { "Blog" = [
    "blog/index.md",
  ]},

  { "friends" = [
    "friends/index.md",
  ]},
]

extra_css = ["css/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
variant     = "classic"
#custom_dir  = "overrides"
favicon     = "img/favicon.ico"
logo        = "img/find.software_logo_5.png"
language    = "en"
features    = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  # "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
  # "toc.integrate",
]

[project.theme.icon]
logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.plugins.tags]
tags    = true
enabled = true 

[project.plugins.callouts]
enabled = true

[project.plugins.blog]

authors = true
post_date_format = "medium"
post_url_date_format = "yyyy/MM/dd"
post_url_format = "{date}/{slug}"
draft = false
draft_on_serve = true

[project.plugins.rss]
enabled = true
match_path = "blog/posts/.*"

[project.plugins.rss.date_from_meta]
as_creation = "date.created"
as_update = "date.updated"


# date_from_meta = [
#  {as_creation = "date.created", as_update =  "date.updated"},
#]


# ---------------------------------------------------------------------------
# Extra / Social / Analytics
# ---------------------------------------------------------------------------

[[project.extra.social]]
icon = "fontawesome/brands/mastodon"
link = "https://mas.to/@find_software"

# [project.extra.analytics]
# provider = "matomo"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/findsoftware"

[[project.extra.social]]
icon = "fontawesome/brands/codeberg"
link = "https://codeberg.org/find-software"

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:find.software@listserv.dfn.de"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
