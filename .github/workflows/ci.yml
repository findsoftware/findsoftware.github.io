name: ci 
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache 
          restore-keys: |
            mkdocs-material-
      - run: pip install poetry
      - run: poetry install
      - run: poetry run mkdocs build
      - run: poetry run mkdocs gh-deploy --force
  notify:
    runs-on: ubuntu-latest
    name: Send message via Matrix
    steps:
    - name: Send message to test room
      id: matrix-chat-message
      uses: select/matrix-message-e2e@main
      with:
        matrix_token: ${{ secrets.matrix_access_token }}
        github_token: ${{ secrets.token_github }}
        homeserver: 'https://matrix.org'
        roomid: '!VXALJPMmuCJorAqLwQ:matrix.org'
        workflow_description: "Website updated!"
        message: "${{ github.event.sender.login }} updated the find.software website."
