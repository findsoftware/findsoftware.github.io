[project]
name = "find.software-website"
version = "0.1.0"
description = "find.software"
readme = "README.md"
license = "CC-BY-4.0"
authors = [
    { name = "Ronny Gey", email = "ronny.gey@ufz.de" }
]
requires-python = ">=3.14"
dependencies = [
    "academic>=0.11.2",
]

[project.scripts]
docs = "docs:main"

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "zensical>=0.1.0",
]
